name: Publish to Maven Central

# Run by hand with the tag the Release workflow created (such as v2026.3.10.0). The steps live in common-parent so that
# every repository publishes the same way.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, such as v2026.3.10.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    uses: piotr-janczukowicz/common-parent/.github/workflows/publish.yml@61adf0e1e2fe23c89d195f45b41d9aa2a2521ec2 # v12
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
