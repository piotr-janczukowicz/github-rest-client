name: Publish to Maven Central

# Run by hand after the Release workflow created a tag. It publishes the newest vN tag; to publish another one, pick
# that tag in "Use workflow from". The steps live in common-parent so that every repository publishes the same way.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    uses: piotr-janczukowicz/common-parent/.github/workflows/reusable-publish.yml@736dd7d218d81bcc26e0489f8853b711ad95f26d # v17
    secrets: inherit
