name: Pull request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    uses: piotr-janczukowicz/common-parent/.github/workflows/reusable-pull-request.yml@736dd7d218d81bcc26e0489f8853b711ad95f26d # v17
    secrets: inherit
